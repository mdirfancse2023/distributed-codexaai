name: Deploy Account Service

on:
  push:
    branches:
      - main
    paths:
      - 'account-service/**'
      - 'common-library/**'

permissions:
  id-token: write
  contents: read

env:
  SERVICE_NAME: account-service
  IMAGE_NAME: mdirfancse2023/codexa-ai-account-service

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to AKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Install Common Library
        working-directory: ./common-library
        run: ./mvnw clean install -DskipTests

      - name: Build and Push Docker Image with Jib
        working-directory: ./${{ env.SERVICE_NAME }}
        run: |
          ./mvnw compile jib:build \
            -Djib.to.image=docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -Djib.to.tags=latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      - name: Connect to AKS
        uses: ./.github/actions/aks-deploy
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER }}

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
            ${{ env.SERVICE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n codexa-ai
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n codexa-ai
