name: Deploy Preview Routing (GKE)

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/proxy/**'
      - 'k8s/infra/ingress.yaml'
      - 'k8s/infra/namespaces.yaml'
      - 'k8s/infra/certificate.yaml'
  workflow_dispatch:

env:
  SERVICE_NAME: codexa-ai-proxy
  IMAGE_NAME: mdirfancse2023/codexa-ai-proxy

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy Preview Routing to GKE
    runs-on: ubuntu-latest
    if: vars.ENABLE_GKE_DEPLOY == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Proxy Image
        uses: docker/build-push-action@v6
        with:
          context: ./k8s/proxy
          file: ./k8s/proxy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Connect to GKE
        uses: ./.github/actions/gke-deploy
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          cluster-name: ${{ secrets.GCP_CLUSTER }}
          location: ${{ secrets.GCP_ZONE }}

      - name: Prepare GKE manifests
        env:
          CODEXA_APP_HOST: ${{ secrets.CODEXA_APP_HOST }}
          CODEXA_API_HOST: ${{ secrets.CODEXA_API_HOST }}
          CODEXA_PREVIEW_DOMAIN: ${{ secrets.CODEXA_PREVIEW_DOMAIN }}
        run: ./scripts/prepare-gke-manifests.sh

      - name: Apply Preview Routing Manifests
        run: |
          kubectl apply -f .k8s-gke-rendered/infra/namespaces.yaml
          kubectl apply -f k8s/proxy/proxy-deployment.yaml
          kubectl apply -f .k8s-gke-rendered/infra/ingress.yaml
          kubectl apply -f .k8s-gke-rendered/infra/certificate.yaml

      - name: Deploy Proxy to GKE
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
            ${{ env.SERVICE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n codexa-ai
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n codexa-ai
