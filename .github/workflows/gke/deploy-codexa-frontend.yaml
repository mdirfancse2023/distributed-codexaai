name: Deploy Codexa Frontend (GKE)

on:
  push:
    branches:
      - main
    paths:
      - 'codexa-frontend/**'
  workflow_dispatch:

env:
  SERVICE_NAME: codexa-frontend
  IMAGE_NAME: mdirfancse2023/codexa-frontend

permissions:
  contents: write
  id-token: write
  pull-requests: write
  actions: write
  checks: write
  statuses: write
  deployments: write

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to GKE
    runs-on: ubuntu-latest
    if: vars.ENABLE_GKE_DEPLOY == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./codexa-frontend
          file: ./codexa-frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.CODEXA_API_URL }}
            VITE_UNSPLASH_ACCESS_KEY=${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Connect to GKE
        uses: ./.github/actions/gke-deploy
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          cluster-name: ${{ secrets.GCP_CLUSTER }}
          location: ${{ secrets.GCP_ZONE }}

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
            ${{ env.SERVICE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n codexa-ai
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n codexa-ai
