name: Deploy Preview Routing

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/proxy/**'
      - 'k8s/infra/ingress.yaml'
      - 'k8s/infra/namespaces.yaml'
      - 'k8s/infra/certificate.yaml'

permissions:
  id-token: write
  contents: read

env:
  SERVICE_NAME: codexa-ai-proxy
  IMAGE_NAME: mdirfancse2023/codexa-ai-proxy

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy Preview Routing to AKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Proxy Image
        uses: docker/build-push-action@v6
        with:
          context: ./k8s/proxy
          file: ./k8s/proxy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Connect to AKS
        uses: ./.github/actions/aks-deploy
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER }}

      - name: Render domain-specific manifests
        env:
          CODEXA_APP_HOST: ${{ secrets.CODEXA_APP_HOST }}
          CODEXA_API_HOST: ${{ secrets.CODEXA_API_HOST }}
          CODEXA_PREVIEW_DOMAIN: ${{ secrets.CODEXA_PREVIEW_DOMAIN }}
        run: ./scripts/configure-domains.sh

      - name: Apply Preview Routing Manifests
        run: |
          kubectl apply -f .k8s-rendered/infra/namespaces.yaml
          kubectl apply -f k8s/proxy/proxy-deployment.yaml
          kubectl apply -f .k8s-rendered/infra/ingress.yaml
          kubectl apply -f .k8s-rendered/infra/certificate.yaml

      - name: Deploy Proxy to AKS
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
            ${{ env.SERVICE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n codexa-ai
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n codexa-ai
