name: Deploy Codexa Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'codexa-frontend/**'

permissions:
  id-token: write
  contents: read

env:
  SERVICE_NAME: codexa-frontend
  IMAGE_NAME: mdirfancse2023/codexa-frontend

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to AKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./codexa-frontend
          file: ./codexa-frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.CODEXA_API_URL }}
            VITE_UNSPLASH_ACCESS_KEY=${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Connect to AKS
        uses: ./.github/actions/aks-deploy
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER }}

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
            ${{ env.SERVICE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n codexa-ai
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n codexa-ai
