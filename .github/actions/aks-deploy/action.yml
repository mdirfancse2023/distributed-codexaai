name: Deploy to AKS
description: Authenticate to Azure via OIDC and configure kubectl for AKS

inputs:
  resource-group:
    description: Azure resource group containing the AKS cluster
    required: true
  cluster-name:
    description: AKS cluster name
    required: true

runs:
  using: composite
  steps:
    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Install kubelogin
      shell: bash
      run: |
        az aks install-cli 2>/dev/null || true

    - name: Start AKS cluster if stopped
      shell: bash
      run: |
        set -euo pipefail
        power_state=$(az aks show \
          --resource-group "${{ inputs.resource-group }}" \
          --name "${{ inputs.cluster-name }}" \
          --subscription "${{ env.AZURE_SUBSCRIPTION_ID }}" \
          --query powerState.code -o tsv 2>/dev/null || echo "Unknown")

        echo "Current AKS power state: ${power_state}"

        if [[ "$power_state" == "Stopped" ]]; then
          az aks start \
            --resource-group "${{ inputs.resource-group }}" \
            --name "${{ inputs.cluster-name }}" \
            --subscription "${{ env.AZURE_SUBSCRIPTION_ID }}"
        elif [[ "$power_state" == "Running" ]]; then
          echo "AKS cluster is already running; skipping start."
        else
          echo "AKS cluster power state is '$power_state'. Attempting az aks update to recover from transient state or previous failed start."
          az aks update \
            --resource-group "${{ inputs.resource-group }}" \
            --name "${{ inputs.cluster-name }}" \
            --subscription "${{ env.AZURE_SUBSCRIPTION_ID }}"
        fi

    - name: Confirm AKS cluster power state
      shell: bash
      run: |
        az aks show \
          --resource-group "${{ inputs.resource-group }}" \
          --name "${{ inputs.cluster-name }}" \
          --query powerState.code \
          -o tsv

    - name: Set AKS context
      shell: bash
      run: |
        az aks get-credentials \
          --resource-group ${{ inputs.resource-group }} \
          --name ${{ inputs.cluster-name }} \
          --subscription ${{ env.AZURE_SUBSCRIPTION_ID }} \
          --overwrite-existing \
          --admin
