name: Deploy to AKS
description: Authenticate to Azure via OIDC and configure kubectl for AKS

inputs:
  resource-group:
    description: Azure resource group containing the AKS cluster
    required: true
  cluster-name:
    description: AKS cluster name
    required: true

runs:
  using: composite
  steps:
    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Install kubelogin
      shell: bash
      run: |
        az aks install-cli 2>/dev/null || true

    - name: Debug — show account context
      shell: bash
      run: |
        echo "=== Current Azure context ==="
        az account show -o table
        echo ""
        echo "=== Input diagnostics ==="
        RG="${{ inputs.resource-group }}"
        CLUSTER="${{ inputs.cluster-name }}"
        echo "resource-group length: ${#RG}"
        echo "cluster-name length: ${#CLUSTER}"
        echo "resource-group hex dump:"
        echo -n "$RG" | xxd | head -3
        echo ""
        echo "=== All resource groups ==="
        az group list --query '[].{name:name, location:location}' -o table
        echo ""
        echo "=== AKS clusters in RG ==="
        az aks list --resource-group "$RG" --query '[].{name:name,state:provisioningState}' -o table || echo "Cannot list AKS clusters"

    - name: Set AKS context
      shell: bash
      run: |
        az aks get-credentials \
          --resource-group ${{ inputs.resource-group }} \
          --name ${{ inputs.cluster-name }} \
          --subscription ${{ env.AZURE_SUBSCRIPTION_ID }} \
          --overwrite-existing \
          --admin
