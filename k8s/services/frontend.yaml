apiVersion: apps/v1
kind: Deployment
metadata:
  name: codexa-frontend
  namespace: codexa-ai
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: codexa-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: codexa-frontend
    spec:
      containers:
        - name: codexa-frontend
          image: mdirfancse2023/codexa-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: codexa-frontend
  namespace: codexa-ai
spec:
  type: ClusterIP
  selector:
    app: codexa-frontend
  ports:
    - port: 80
      targetPort: 80