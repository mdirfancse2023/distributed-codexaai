apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codexa-main-ingress
  namespace: codexa-ai
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "${CODEXA_API_HOST}"
      secretName: codexa-tls-secret
  rules:
    # API Gateway Route (Custom domain or sslip.io API host)
    - host: "${CODEXA_API_HOST}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codexa-preview-ingress
  namespace: codexa-ai
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "*.${CODEXA_PREVIEW_DOMAIN}"
      secretName: virtualgyans-preview-tls-secret
  rules:
    - host: "*.${CODEXA_PREVIEW_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codexa-ai-proxy
                port:
                  number: 80
