apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codexa-main-ingress
  namespace: codexa-ai
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "${CODEXA_APP_HOST}"
      secretName: codexa-tls-secret
  rules:
    # 1. Main Website Route
    # Route the main host through the proxy so HTTPS path-based previews can
    # share the same certificate and still resolve Vite asset/HMR requests.
    - host: "${CODEXA_APP_HOST}"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codexa-ai-proxy
                port:
                  number: 80

    # 2. API Gateway Route
    - host: "${CODEXA_API_HOST}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codexa-preview-ingress
  namespace: codexa-ai
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # sslip.io wildcard preview hosts cannot use a trusted wildcard cert here,
    # so keep preview traffic on HTTP instead of redirecting to HTTPS.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: "nginx"
  rules:
    - host: "*.${CODEXA_PREVIEW_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codexa-ai-proxy
                port:
                  number: 80

---
# 3. Custom domain — www.virtualgyans.tech/codexaai
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codexa-custom-domain-ingress
  namespace: codexa-ai
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "www.virtualgyans.tech"
      secretName: virtualgyans-tls-secret
  rules:
    - host: "www.virtualgyans.tech"
      http:
        paths:
          # Frontend: www.virtualgyans.tech/codexaai -> frontend /
          - path: /codexaai(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: codexa-ai-proxy
                port:
                  number: 80
          # API: www.virtualgyans.tech/codexaai/api -> api-gateway /
          - path: /codexaai/api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 80



